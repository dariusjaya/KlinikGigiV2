services:
  postgres:
    image: postgres:16
    container_name: klinikgigi-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: klinikgigiv2
    ports:
      - "5434:5432"
    volumes:
      - klinikgigi-data:/var/lib/postgresql/data

volumes:
  klinikgigi-data:
